[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ton-gram-price-predictor"
version = "0.9.3"
description = "TON (GRAM) price prediction toolkit — data ingestion, feature engineering, model ensembles, and backtesting for TON/USDT and GRAM pairs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ton-gram-labs", email = "dev@ton-gram-labs.dev" }]
keywords = ["ton", "gram", "toncoin", "price-prediction", "forecasting", "quant", "crypto"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.12,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "structlog>=24.1,<25",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
    "tenacity>=8.2,<10",
    "lightgbm>=4.3,<5",
    "scikit-learn>=1.4,<2",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "respx>=0.21",
]
torch = ["torch>=2.3,<3"]

[project.scripts]
tonpredict = "ton_price_predictor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=ton_price_predictor --cov-report=term-missing"